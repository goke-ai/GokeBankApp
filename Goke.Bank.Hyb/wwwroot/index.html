<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Goke.Bank.Hyb</title>
    <base href="/" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="Goke.Bank.Hyb.styles.css" />
    <link rel="icon" href="data:,">
</head>

<body>

    <div class="status-bar-safe-area"></div>

    <div id="app">Loading...</div>

    <div id="blazor-error-ui" data-nosnippet>
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script>
        window.themeManager = {
            setTheme(theme) {
                document.documentElement.setAttribute('data-bs-theme', theme);
            },

            getTheme() {
                return document.documentElement.getAttribute('data-bs-theme');
            },

            setStorageTheme(theme) {
                localStorage.setItem('theme', theme);
            },

            getStorageTheme() {
                return localStorage.getItem('theme');
            },

            // Detects current system theme: "light" or "dark"
            getSystemTheme: function () {
                return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            },

            // Allows .NET to subscribe to theme changes
            registerThemeChangeHandler: function (dotNetObjRef) {
                const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
                mediaQuery.addEventListener('change', e => {
                    const theme = e.matches ? 'dark' : 'light';
                    dotNetObjRef.invokeMethodAsync('OnThemeChanged', theme);
                });
            }
        };
    </script>
    <script src="theme.js"></script>
    <script src="_framework/blazor.webview.js" autostart="false"></script>

</body>

</html>
